    <h2 style="text-align: center; padding-top: 20px;">PATIENTS ON THE GLOBE</h2>
<div id="mapholder" style="width: 100%; height: 500px;border-radius: 50%;mardin-top: 20px;"></div> </div>
<script src="http://maps.google.com/maps/api/js?Key=AIzaSyC9D0BFEmwifzsx76oqbLsDrsNpGweeT-k"></script>
<script>
function showPosition() {
    fetch('/get_locations')
        .then(response => response.json())
        .then(users => {
            var mapOptions = {
                center: new google.maps.LatLng(users[0].latitude, users[0].longitude),
                zoom: 14,
                mapTypeId: google.maps.MapTypeId.ROADMAP,
                mapTypeControl: false,
                navigationControlOptions: {style: google.maps.NavigationControlStyle.SMALL}
            };
            var map = new google.maps.Map(document.getElementById("mapholder"), mapOptions);

            users.forEach(user => {
                var latlon = new google.maps.LatLng(user.latitude, user.longitude);
                var marker = new google.maps.Marker({
                    position: latlon,
                    map: map,
                    title: user.username
                });
                var infowindow = new google.maps.InfoWindow({
                    content: user.details // Display user details in the info window
                });
                marker.addListener('click', function() {
                    infowindow.open(map, marker);
                });
            });
        });
}
showPosition();
</script>
